version: 2
updates:
  # NuGet: app + tests in one monthly grouped PR.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns:
          - "*"

  # GitHub Actions: one monthly grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
